<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dwarven Companion</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header id="status-bar" class="status-bar">
      <span class="brand">&#9935; Dwarven Council</span>
      <span id="status-connection" class="status-pill status-pill--unknown">Connecting&hellip;</span>
      <span id="status-date" class="status-item">Date: &mdash;</span>
      <span id="status-next-season" class="status-item">Next season: &mdash;</span>
      <span id="status-cycle" class="status-item" hidden>Assembly in progress&hellip;</span>
      <span id="status-error" class="status-item status-item--error" hidden></span>
      <button id="trigger-now" class="trigger-button" type="button">Trigger assembly now</button>
    </header>

    <nav class="tabs" role="tablist">
      <button id="tab-current" class="tab tab--active" type="button" role="tab" aria-selected="true" data-tab="current">Current</button>
      <button id="tab-history" class="tab" type="button" role="tab" aria-selected="false" data-tab="history">History</button>
    </nav>

    <main class="page">
      <section id="pane-current" class="pane pane--active" role="tabpanel">
        <p id="current-empty" class="empty-state">No assemblies recorded yet.</p>
      </section>

      <section id="pane-history" class="pane" role="tabpanel">
        <p id="history-empty" class="empty-state">No assemblies recorded yet.</p>
        <div id="history-list" class="history-list"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
